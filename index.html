<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치/홈 인디케이터 영역까지 배경을 채우고 safe-area inset으로 콘텐츠를 밀어낸다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />

    <!--
      아래 절대 경로들은 vite.config.ts의 BASE와 같은 값이어야 한다.
      index.html은 정적 파일이라 상수를 참조할 수 없다 — 레포명을 바꾸면 이 파일에서
      /workout-tracker/ 를 전부 치환해야 한다 (아이콘 2개 + 스플래시 8개).
    -->
    <!-- iOS 홈 화면 웹앱 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="운동기록" />
    <link rel="apple-touch-icon" href="/workout-tracker/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/workout-tracker/icons/icon.svg" />

    <!--
      iOS 홈 화면 앱 스플래시.
      startup-image는 기기 해상도와 **정확히** 일치하는 것만 쓰인다. 하나도 안 맞으면
      실행 시 흰 화면이 번쩍이는데, 다크 테마 앱에서 특히 거슬린다.
      device-width/height는 CSS px이고 dpr로 @2x·@3x를 구분한다
      (375×812는 @3x=X 계열, 375×667은 @2x=SE 계열).
    -->
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/workout-tracker/splash/750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />

    <meta name="format-detection" content="telephone=no" />
    <title>운동 기록</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
