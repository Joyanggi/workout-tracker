name: Security

# 보안 검사 두 가지. 결과는 레포의 Security 탭(Code scanning)에 쌓인다.
#   CodeQL       — 코드 안의 취약 패턴(XSS, 비밀값 누출 경로 등)
#   OSV-Scanner  — package-lock.json의 알려진 취약 의존성. PR에서는 "이 PR이 새로 들인 것"만 실패로 친다
# main 보호 규칙의 필수 검사는 `ci` 하나다. 이 워크플로는 필수가 아니다(외부 서비스가 느려도 머지를 막지 않게).
# 실패하면 지휘자가 PR 본문 "검증"에 적고 사람이 판단한다(agents/coordinator/PR.md 4절).

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 21 * * 0' # 월요일 06:30 KST

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  osv-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.1

  osv-scheduled:
    if: github.event_name == 'schedule'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
