name: 구조 변경
description: "저장 방식·백업·화면 구조처럼 뼈대를 바꿀 때 (예: Gist 백업 → DB)"
title: "[구조 변경] "
labels: ["구조 변경"]
body:
  - type: markdown
    attributes:
      value: |
        지휘자에게는 "/coord 이슈 #번호 진행해"로 넘긴다. 구조 변경은 늘 설계 흐름이다.
        설계자는 데이터 이전·되돌리기·단계 나누기를 반드시 설계서에 둔다.
  - type: textarea
    id: limit
    attributes:
      label: 지금 구조의 한계
      description: 무엇이 안 되거나 위험한가. 실제로 겪은 일로.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 바꾸려는 방향과 다른 선택지
      description: 생각한 안을 모두 적는다. "그대로 두기"도 선택지다.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: 핵심 설계 결정
      options:
        - label: "README \"핵심 설계 결정\"을 뒤집는다 (예: 서버가 생긴다). 체크하면 이 이슈가 그 변경을 승인한 것으로 본다"
  - type: textarea
    id: migration
    attributes:
      label: 기존 데이터
      description: 폰의 IndexedDB 기록과 Gist 백업은 어떻게 되어야 하나 (그대로 읽힘 / 한 번 옮김 / 버려도 됨)
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 되돌리기
      description: 배포 뒤 문제가 생기면 어떻게 돌아갈 수 있어야 하나
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 나눌 단계 (알면)
      description: 각 단계가 끝날 때 앱이 정상으로 쓸 수 있는 상태여야 한다
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
    validations:
      required: true
